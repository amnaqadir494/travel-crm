<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Your Account - Deluxe CRM</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 400px; text-align: center; }
        .card h2 { color: #229b9e; margin-bottom: 8px; font-size: 20px; }
        .card p.subtitle { color: #718096; font-size: 13px; margin-bottom: 25px; }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #229b9e; }
        .hint { font-size: 11px; color: #a0aec0; margin-top: 4px; }

        .btn-submit { background: #229b9e; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 5px; }
        .btn-submit:hover { background: #1b7f82; }

        .error-msg { background: #fed7d7; color: #9b2c2c; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; }
        .success-msg { background: #c6f6d5; color: #22543d; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; }

        .back-link { margin-top: 20px; font-size: 13px; }
        .back-link a { color: #229b9e; font-weight: 600; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <img src="/logo.png" alt="Deluxe Holidays Logo" style="width: 120px; margin-bottom: 15px;">
    <h2>Activate Your Account</h2>
    <p class="subtitle"></p>

    <div id="errorBox" class="error-msg"></div>
    <div id="successBox" class="success-msg"></div>

    <form id="activateForm">
        <div class="form-group">
            <label>Employee ID</label>
            <input type="text" id="employeeId" required placeholder="e.g. DLX-0007">
            <div class="hint"></div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="activateEmail" required placeholder="you@deluxe.com">
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" required placeholder="••••••••">
            <div class="hint">minimum 8 characters, uppercase, lowercase, number & special character</div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit">Activate Account</button>
    </form>

    <div class="back-link">
        <a href="/login.html">Back to Login</a>
    </div>
</div>

<script src="/activate.js"></script>
</body>
</html>
